name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning

  test:
    name: Tests (bats)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: |
          sudo apt-get install -y bats openssl

      - name: Generate test certificates
        run: |
          mkdir -p tests/fixtures
          # Generate a CA
          openssl genrsa -out tests/fixtures/ca.key 2048
          openssl req -new -x509 -days 3650 -key tests/fixtures/ca.key \
            -out tests/fixtures/ca.crt \
            -subj "/CN=Test CA/O=TestOrg/C=MA"
          # Generate server key and cert signed by CA
          openssl genrsa -out tests/fixtures/server.key 2048
          openssl req -new -key tests/fixtures/server.key \
            -out tests/fixtures/server.csr \
            -subj "/CN=example.com/O=TestOrg/C=MA"
          openssl x509 -req -days 365 \
            -in tests/fixtures/server.csr \
            -CA tests/fixtures/ca.crt \
            -CAkey tests/fixtures/ca.key \
            -CAcreateserial \
            -out tests/fixtures/server.crt
          # Generate a mismatched key
          openssl genrsa -out tests/fixtures/wrong.key 2048

      - name: Run tests
        run: bats tests/

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: version
        run: echo "VERSION=$(grep '^VERSION=' check_cert_key_match | cut -d'"' -f2)" >> $GITHUB_OUTPUT
      - name: Create tag if not exists
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "v${{ steps.version.outputs.VERSION }}" -m "Release v${{ steps.version.outputs.VERSION }}" || true
          git push --tags || true
